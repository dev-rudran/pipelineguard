name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@875352b1a9cf8ccff0f4996f4c645fafb6380d4c

      - name: Set up Python
        uses: actions/setup-python@875352b1a9cf8ccff0f4996f4c645fafb6380d4c
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest
