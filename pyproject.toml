[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelineguard"
version = "0.1.0"
description = "The CI/CD security gate: secret scanning, dependency audit, SBOM and CI configuration audit in one command."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rudra Tushir", email = "rudraking2404@gmail.com" }]
keywords = [
  "security",
  "ci",
  "secrets",
  "sbom",
  "cyclonedx",
  "sarif",
  "devsecops",
  "supply-chain",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0",
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "bandit>=1.7"]

[project.scripts]
pipelineguard = "pipelineguard.cli:main"

[project.urls]
Homepage = "https://github.com/dev-rudran/pipelineguard"
Issues = "https://github.com/dev-rudran/pipelineguard/issues"
Changelog = "https://github.com/dev-rudran/pipelineguard/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipelineguard = ["secrets_rules.yml", "advisories/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011", "SIM117"]
"examples/*" = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "build", "dist"]
