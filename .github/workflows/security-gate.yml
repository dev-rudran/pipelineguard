name: Pipelineguard security gate

on:
  workflow_call:
    inputs:
      path:
        description: Repository or directory to scan.
        required: false
        type: string
        default: "."
      fail-on:
        description: Lowest severity that fails the gate.
        required: false
        type: string
        default: high
      policy:
        description: Policy file path. Empty uses <path>/pipelineguard.yaml when present.
        required: false
        type: string
        default: ""
      offline:
        description: Disable OSV network access.
        required: false
        type: boolean
        default: true
      advisory-db:
        description: Local OSV advisory JSON file for offline auditing.
        required: false
        type: string
        default: ""
      format:
        description: Comma separated output formats or "all".
        required: false
        type: string
        default: "sarif,console"
      output-dir:
        description: Directory for generated reports.
        required: false
        type: string
        default: pipelineguard-results
      upload-sarif:
        description: Upload results.sarif to GitHub code scanning.
        required: false
        type: boolean
        default: true
      artifact-name:
        description: Artifact name for uploaded reports.
        required: false
        type: string
        default: pipelineguard-results
      ref:
        description: Git ref of dev-rudran/pipelineguard to install.
        required: false
        type: string
        default: main
    outputs:
      exit-code:
        description: Pipelineguard exit code (0 pass, 1 gate failure, 2 tool error).
        value: ${{ jobs.gate.outputs.exit-code }}
      sarif-file:
        description: Path to the generated SARIF file, or empty when none was written.
        value: ${{ jobs.gate.outputs.sarif-file }}

permissions:
  contents: read

jobs:
  gate:
    name: Security gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      exit-code: ${{ steps.scan.outputs.exit-code }}
      sarif-file: ${{ steps.scan.outputs.sarif-file }}
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pipelineguard
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            "pipelineguard @ git+https://github.com/dev-rudran/pipelineguard@${INPUT_REF}"

      - id: scan
        name: Run the gate
        continue-on-error: true
        env:
          INPUT_PATH: ${{ inputs.path }}
          INPUT_FAIL_ON: ${{ inputs.fail-on }}
          INPUT_POLICY: ${{ inputs.policy }}
          INPUT_OFFLINE: ${{ inputs.offline }}
          INPUT_ADVISORY_DB: ${{ inputs.advisory-db }}
          INPUT_FORMAT: ${{ inputs.format }}
          INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        run: |
          set -u
          echo "exit-code=2" >> "$GITHUB_OUTPUT"
          echo "sarif-file=" >> "$GITHUB_OUTPUT"
          args=(scan "$INPUT_PATH" --format "$INPUT_FORMAT" --output-dir "$INPUT_OUTPUT_DIR" --no-color)
          if [ -n "$INPUT_FAIL_ON" ]; then
            args+=(--fail-on "$INPUT_FAIL_ON")
          fi
          if [ -n "$INPUT_POLICY" ]; then
            args+=(--policy "$INPUT_POLICY")
          fi
          if [ "$INPUT_OFFLINE" = "true" ]; then
            args+=(--offline)
          fi
          if [ -n "$INPUT_ADVISORY_DB" ]; then
            args+=(--advisory-db "$INPUT_ADVISORY_DB")
          fi
          set +e
          pipelineguard "${args[@]}"
          code=$?
          set -e
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          if [ -f "$INPUT_OUTPUT_DIR/results.sarif" ]; then
            echo "sarif-file=$INPUT_OUTPUT_DIR/results.sarif" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF
        if: ${{ always() && inputs.upload-sarif && steps.scan.outputs.sarif-file != '' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif-file }}
          category: pipelineguard

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.output-dir }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce the gate verdict
        if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          code="${EXIT_CODE:-2}"
          echo "pipelineguard exit code: $code"
          exit "$code"
