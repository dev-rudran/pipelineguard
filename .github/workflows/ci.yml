name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Static security analysis
        run: bandit -q -r src

      - name: Test
        run: pytest

  gate:
    name: Self scan and examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --disable-pip-version-check -e .

      - name: Scan pipelineguard itself
        run: |
          pipelineguard scan . --offline --format all \
            --output-dir pipelineguard-results --no-color

      - name: Scan the clean example
        run: |
          pipelineguard scan examples/clean-repo --offline \
            --advisory-db src/pipelineguard/advisories/osv-fixture.json --quiet

      - name: Scan the vulnerable example and require a gate failure
        run: |
          set +e
          pipelineguard scan examples/vulnerable-repo --offline \
            --advisory-db src/pipelineguard/advisories/osv-fixture.json --quiet
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 from the vulnerable example, got $code"
            exit 1
          fi

      - name: Upload SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: pipelineguard-results/results.sarif
          category: pipelineguard

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipelineguard-results
          path: pipelineguard-results
          if-no-files-found: ignore
          retention-days: 7
