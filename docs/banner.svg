<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">pipelineguard</title>
  <description id="description">CI/CD security gate for secrets, dependencies, SBOMs and configuration.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111c31"/>
      <stop offset="1" stop-color="#0a1a2b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <g transform="translate(88 74)">
    <path d="M62 2 116 23v52c0 38-22 65-54 79C30 140 8 113 8 75V23L62 2z" fill="none" stroke="url(#shield)" stroke-width="6"/>
    <path d="M38 76l16 17 32-38" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="224" y="128" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5">pipelineguard</text>
  <text x="228" y="174" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="25" letter-spacing="0.4">One gate for secrets, dependencies, SBOMs and CI configuration</text>

  <rect x="228" y="204" width="780" height="2" fill="url(#line)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7dd3fc">
    <text x="228" y="243">secrets</text>
    <text x="340" y="243">deps</text>
    <text x="420" y="243">sbom</text>
    <text x="500" y="243">config</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#64748b">
    <text x="600" y="243">console  json  sarif  markdown  cyclonedx</text>
  </g>

  <text x="1090" y="243" text-anchor="end" fill="#475569" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">v0.1.0</text>
