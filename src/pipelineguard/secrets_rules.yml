# Bundled secret detection rules for pipelineguard.
#
# Each rule is matched line by line. `secret_group` selects the capture group
# that holds the credential (0 means the whole match). `min_entropy` compares
# against Shannon entropy after normalizing common character substitutions.
# Documented vendor example values are allowlisted in util/entropy.py.
version: 1
allowlist:
  paths:
    - "**/*.min.js"
    - "**/*.map"
    - "**/vendor/**"
    - "**/third_party/**"
rules:
  - id: PIPE-SEC-001
    name: AWS access key ID
    description: AWS access key identifiers grant programmatic access to an account.
    severity: critical
    patterns:
      - '(?<![A-Z0-9])(AKIA|ASIA)[0-9A-Z]{15,17}(?![A-Z0-9])'
    secret_group: 0
    min_length: 19
    keywords: ["AKIA", "ASIA"]
    remediation: Revoke the key in IAM, rotate credentials and load them from a secret manager.
    references:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html

  - id: PIPE-SEC-002
    name: AWS secret access key
    description: The secret half of an AWS access key pair.
    severity: critical
    patterns:
      - '(?i)aws_?secret_?access_?key\s*[:=]\s*["'']?([A-Za-z0-9/+=]{39,40})["'']?'
    secret_group: 1
    min_length: 39
    min_entropy: 3.0
    keywords: ["aws_secret", "aws-secret", "secret_access", "secretaccess"]
    remediation: Revoke the key pair in IAM and rotate every credential that used it.
    references:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html

  - id: PIPE-SEC-003
    name: GitHub token
    description: GitHub personal access, OAuth, user, server or refresh token.
    severity: critical
    patterns:
      - '\b(gh[pousr]_[A-Za-z0-9]{36,255})\b'
    secret_group: 1
    min_length: 40
    keywords: ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]
    remediation: Revoke the token in GitHub settings and replace it with a short-lived installation token.
    references:
      - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens

  - id: PIPE-SEC-004
    name: GitHub fine-grained personal access token
    description: Fine-grained GitHub token with repository scoped permissions.
    severity: critical
    patterns:
      - '\b(github_pat_[A-Za-z0-9_]{60,255})\b'
    secret_group: 1
    min_length: 70
    keywords: ["github_pat_"]
    remediation: Revoke the token in GitHub settings and issue a least-privilege replacement.
    references:
      - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens

  - id: PIPE-SEC-005
    name: GitLab personal access token
    description: GitLab PAT with API scope.
    severity: critical
    patterns:
      - '\b(glpat-[A-Za-z0-9_-]{20,64})\b'
    secret_group: 1
    min_length: 26
    keywords: ["glpat-"]
    remediation: Revoke the token under User Settings, Access Tokens.
    references:
      - https://docs.gitlab.com/ee/user/profile/personal_access_tokens.html

  - id: PIPE-SEC-006
    name: Slack token
    description: Slack bot, user, app or refresh token.
    severity: high
    patterns:
      - '\b(xox[abposr]-[A-Za-z0-9-]{10,250})\b'
    secret_group: 1
    min_length: 20
    keywords: ["xox"]
    remediation: Revoke the token in the Slack app configuration and reinstall the app.
    references:
      - https://api.slack.com/authentication/token-types

  - id: PIPE-SEC-007
    name: Slack incoming webhook
    description: Webhook URL that can post messages into a workspace channel.
    severity: high
    patterns:
      - '(https://hooks\.slack\.com/services/T[A-Z0-9]{8,}/B[A-Z0-9]{8,}/[A-Za-z0-9]{20,})'
    secret_group: 1
    min_length: 40
    keywords: ["hooks.slack.com"]
    remediation: Revoke the webhook in Slack and store the replacement as a secret.
    references:
      - https://api.slack.com/messaging/webhooks

  - id: PIPE-SEC-008
    name: Stripe live secret key
    description: Stripe live mode key that can move money and read customer data.
    severity: critical
    patterns:
      - '\b((?:sk|rk)_live_[0-9A-Za-z]{16,99})\b'
    secret_group: 1
    min_length: 24
    keywords: ["sk_live_", "rk_live_"]
    remediation: Roll the key in the Stripe dashboard and audit recent API activity.
    references:
      - https://stripe.com/docs/keys

  - id: PIPE-SEC-009
    name: Google API key
    description: Google API key, often unrestricted and billable.
    severity: high
    patterns:
      - '\b(AIza[0-9A-Za-z_-]{35})\b'
    secret_group: 1
    min_length: 39
    keywords: ["AIza"]
    remediation: Delete the key in Google Cloud Console and restrict replacements by API and referrer.
    references:
      - https://cloud.google.com/docs/authentication/api-keys

  - id: PIPE-SEC-010
    name: Private key block
    description: PEM or OpenSSH private key material.
    severity: critical
    patterns:
      - '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----'
    secret_group: 0
    min_length: 20
    keywords: ["BEGIN", "PRIVATE KEY"]
    remediation: Remove the key from the repository, rotate it and store it in a secret manager.
    references:
      - https://csrc.nist.gov/glossary/term/private_key

  - id: PIPE-SEC-011
    name: JSON Web Token
    description: Signed JWT that may carry long lived authorization claims.
    severity: high
    patterns:
      - '\b(eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})\b'
    secret_group: 1
    min_length: 39
    min_entropy: 3.0
    keywords: ["eyJ"]
    remediation: Revoke the signing key, rotate the token and shorten its lifetime.
    references:
      - https://datatracker.ietf.org/doc/html/rfc7519

  - id: PIPE-SEC-012
    name: npm access token
    description: npm automation token able to publish packages.
    severity: high
    patterns:
      - '\b(npm_[A-Za-z0-9]{36,64})\b'
    secret_group: 1
    min_length: 40
    keywords: ["npm_"]
    remediation: Revoke the token on npmjs.com and publish with provenance instead.
    references:
      - https://docs.npmjs.com/about-access-tokens

  - id: PIPE-SEC-013
    name: PyPI upload token
    description: PyPI API token able to upload releases.
    severity: high
    patterns:
      - '\b(pypi-[A-Za-z0-9_-]{50,200})\b'
    secret_group: 1
    min_length: 56
    keywords: ["pypi-"]
    remediation: Revoke the token in PyPI account settings and use trusted publishing.
    references:
      - https://pypi.org/help/#apitoken

  - id: PIPE-SEC-014
    name: SendGrid API key
    description: SendGrid key that can send mail as the organization.
    severity: high
    patterns:
      - '\b(SG\.[A-Za-z0-9_-]{16,32}\.[A-Za-z0-9_-]{32,64})\b'
    secret_group: 1
    min_length: 50
    keywords: ["SG."]
    remediation: Delete the key in SendGrid and create a restricted replacement.
    references:
      - https://docs.sendgrid.com/ui/account-and-settings/api-keys

  - id: PIPE-SEC-015
    name: Twilio auth token
    description: Twilio auth token used to sign API requests.
    severity: high
    patterns:
      - '(?i)twilio[_-]?(?:auth[_-]?)?token\s*[:=]\s*["'']?([0-9a-f]{32})["'']?'
    secret_group: 1
    min_length: 32
    min_entropy: 2.5
    keywords: ["twilio"]
    remediation: Rotate the auth token in the Twilio console.
    references:
      - https://www.twilio.com/docs/iam/keys/api-key

  - id: PIPE-SEC-016
    name: Heroku API key
    description: Heroku API key or OAuth token.
    severity: high
    patterns:
      - '(?i)heroku[_-]?(?:api[_-]?)?(?:key|token)\s*[:=]\s*["'']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})["'']?'
    secret_group: 1
    min_length: 36
    min_entropy: 3.0
    keywords: ["heroku"]
    remediation: Revoke the key in Heroku account settings and rotate the credential.
    references:
      - https://devcenter.heroku.com/articles/authentication

  - id: PIPE-SEC-017
    name: Azure storage account key
    description: Azure Storage account key with full data plane access.
    severity: critical
    patterns:
      - '(?i)AccountKey\s*=\s*([A-Za-z0-9+/]{40,}={0,2})'
    secret_group: 1
    min_length: 39
    min_entropy: 3.0
    keywords: ["AccountKey"]
    remediation: Rotate both storage keys and move consumers to managed identities.
    references:
      - https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage

  - id: PIPE-SEC-018
    name: Generic credential assignment
    description: A password, secret, API key or token assigned to a literal value.
    severity: high
    patterns:
      - '(?i)(?:password|passwd|pwd|secret|api[_-]?key|apikey|access[_-]?token|auth[_-]?token|token)\s*[:=]\s*["'']?([A-Za-z0-9_\-./+=!@#$%^&*]{12,})["'']?'
    secret_group: 1
    min_length: 12
    min_entropy: 3.5
    keywords: ["password", "passwd", "pwd", "secret", "api_key", "apikey", "token"]
    remediation: Remove the literal, rotate the credential and load it from the environment or a secret manager.
    references:
      - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
